<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Dashboard | Gráfica Integrada con Bootstrap</title>
  
   <!-- Bootstrap 5.3 CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
   <!-- Chart.js -->
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/botones.css">
   <style>
       /* Estética global Fumitek V2 */
       :root {
           --fk-negro: #001C45;
           --fk-oscuro: #002355;
           --fk-oscuro-activo: #002D55;
           --fk-primario: #0088FF;
           --fk-azul-claro: #AAD7FF;
           --fk-verde: #2DC628;
           --fk-verde-oscuro: #013E00;
           --fk-cta: #FF7014;
           --fk-cta-oscuro: #552707;
           --fk-fondo: #F4F7FB;
           --fk-borde: #DDE5F0;
           --fk-texto: #1E2B3C;
           --fk-radio: 8px;
           --fk-transicion: 150ms ease-out;

           --bs-primary: #0088FF;
           --bs-primary-rgb: 0, 136, 255;
           --bs-success: #2DC628;
           --bs-success-rgb: 45, 198, 40;
           --bs-warning: #FF7014;
           --bs-warning-rgb: 255, 112, 20;
           --bs-dark: #001C45;
           --bs-dark-rgb: 0, 28, 69;
           --bs-body-font-family: "Inter", sans-serif;
           --bs-border-radius: 8px;
       }

       /* Colores claros de Bootstrap: solo fuera del tema oscuro */
       :root:not([data-bs-theme="dark"]) {
           --bs-body-bg: #F4F7FB;
           --bs-body-bg-rgb: 244, 247, 251;
           --bs-body-color: #1E2B3C;
           --bs-body-color-rgb: 30, 43, 60;
           --bs-link-color: #0088FF;
           --bs-link-color-rgb: 0, 136, 255;
           --bs-border-color: #DDE5F0;
       }

       /* Tema oscuro (inicioadmin.html) */
       [data-bs-theme="dark"] {
           --fk-fondo: #0B1626;
           --fk-texto: #E6ECF5;
           --fk-borde: #1F3350;
       }

       /* ---------- Tipografía ---------- */
       body {
           font-family: "Inter", sans-serif;
           background-color: var(--fk-fondo);
       }

       body.bg-light {
           background-color: var(--fk-fondo) !important;
       }

       h1, h2, h3, h4, h5, h6,
       .h1, .h2, .h3, .h4, .h5, .h6,
       .navbar-brand, .modal-title, .card-title, .dropdown-header {
           font-family: "Montserrat", sans-serif;
           font-weight: 700;
           color: var(--fk-oscuro);
       }

       /* ---------- Navbar ---------- */
       .navbar.bg-dark {
           background-color: var(--fk-negro) !important;
           min-height: 80px;
       }

       .navbar.bg-dark .navbar-brand {
           font-family: "Montserrat", sans-serif;
           font-weight: 700;
           color: #FFFFFF;
       }

       .navbar.bg-dark .nav-link {
           font-family: "Inter", sans-serif;
           font-size: 18px;
           color: #FFFFFF;
           transition: color var(--fk-transicion);
       }

       .navbar.bg-dark .nav-link:hover,
       .navbar.bg-dark .nav-link.active {
           color: var(--fk-verde);
       }

       /* Iniciar sesión */
       .navbar .btn-outline-light {
           --bs-btn-color: #FFFFFF;
           --bs-btn-bg: var(--fk-cta);
           --bs-btn-border-color: var(--fk-cta);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-cta-oscuro);
           --bs-btn-hover-border-color: var(--fk-cta-oscuro);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-cta-oscuro);
           --bs-btn-active-border-color: var(--fk-cta-oscuro);
       }

       /* Cerrar sesión */
       .navbar .btn-outline-danger {
           --bs-btn-color: var(--fk-cta);
           --bs-btn-bg: transparent;
           --bs-btn-border-color: var(--fk-cta);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-cta);
           --bs-btn-hover-border-color: var(--fk-cta);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-cta);
           --bs-btn-active-border-color: var(--fk-cta);
       }

       /* ---------- Dropdowns ---------- */
       .dropdown-menu {
           --bs-dropdown-border-radius: var(--fk-radio);
           --bs-dropdown-border-color: var(--fk-borde);
           --bs-dropdown-link-hover-bg: rgba(0, 136, 255, .1);
           --bs-dropdown-link-hover-color: var(--fk-primario);
           --bs-dropdown-link-active-bg: rgba(0, 136, 255, .1);
           --bs-dropdown-link-active-color: var(--fk-primario);
           box-shadow: 0 8px 24px rgba(0, 28, 69, .08);
       }

       .dropdown-header {
           font-size: 12px;
           text-transform: uppercase;
           color: var(--fk-primario);
       }

       /* ---------- Tarjetas ---------- */
       .card {
           --bs-card-border-radius: var(--fk-radio);
           --bs-card-border-color: var(--fk-borde);
           box-shadow: 0 2px 8px rgba(0, 28, 69, .06);
       }

       .card-header {
           background-color: #FFFFFF;
           font-family: "Montserrat", sans-serif;
           font-weight: 600;
       }

       /* ---------- Formularios ---------- */
       .form-label {
           font-family: "Inter", sans-serif;
           font-weight: 600;
           color: var(--fk-oscuro);
       }

       .form-control,
       .form-select {
           border-radius: var(--fk-radio);
       }

       .form-control:focus,
       .form-select:focus,
       .form-check-input:focus {
           border-color: var(--fk-primario);
           box-shadow: 0 0 0 .25rem rgba(0, 136, 255, .18);
       }

       .form-check-input:checked {
           background-color: var(--fk-primario);
           border-color: var(--fk-primario);
       }

       /* ---------- Tablas ---------- */
       .table > thead th {
           background-color: var(--fk-oscuro);
           color: #FFFFFF;
           font-family: "Montserrat", sans-serif;
           font-weight: 600;
       }

       .table-dark {
           --bs-table-bg: var(--fk-oscuro);
           --bs-table-color: #FFFFFF;
           --bs-table-border-color: rgba(255, 255, 255, .15);
       }

       .table-dark th {
           font-family: "Montserrat", sans-serif;
           font-weight: 600;
       }

       .table > tbody > tr:hover > * {
           --bs-table-bg-state: rgba(0, 136, 255, .06);
       }

       /* ---------- Modales ---------- */
       .modal {
           --bs-modal-border-width: 0;
           --bs-modal-border-radius: 12px;
           --bs-modal-inner-border-radius: 12px;
           --bs-modal-header-border-color: var(--fk-borde);
           --bs-modal-footer-border-color: var(--fk-borde);
       }

       .modal-content {
           box-shadow: 0 20px 48px rgba(0, 28, 69, .25);
       }

       /* ---------- Badges ---------- */
       .badge {
           --bs-badge-border-radius: 999px;
       }

       .text-bg-success {
           background-color: var(--fk-verde) !important;
       }

       /* ---------- Botones Bootstrap (las clases fk-* viven en botones.css) ---------- */
       .btn-primary, .btn-success, .btn-warning, .btn-secondary,
       .btn-outline-primary, .btn-outline-success, .btn-outline-warning, .btn-outline-secondary {
           --bs-btn-border-radius: var(--fk-radio);
           transition: color var(--fk-transicion),
                       background-color var(--fk-transicion),
                       border-color var(--fk-transicion),
                       box-shadow var(--fk-transicion);
       }

       .btn-primary {
           --bs-btn-color: #FFFFFF;
           --bs-btn-bg: var(--fk-primario);
           --bs-btn-border-color: var(--fk-primario);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-oscuro-activo);
           --bs-btn-hover-border-color: var(--fk-oscuro-activo);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-oscuro-activo);
           --bs-btn-active-border-color: var(--fk-oscuro-activo);
           --bs-btn-disabled-bg: var(--fk-primario);
           --bs-btn-disabled-border-color: var(--fk-primario);
           --bs-btn-focus-shadow-rgb: 0, 136, 255;
       }

       .btn-success {
           --bs-btn-color: #FFFFFF;
           --bs-btn-bg: var(--fk-verde);
           --bs-btn-border-color: var(--fk-verde);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-verde-oscuro);
           --bs-btn-hover-border-color: var(--fk-verde-oscuro);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-verde-oscuro);
           --bs-btn-active-border-color: var(--fk-verde-oscuro);
           --bs-btn-disabled-bg: var(--fk-verde);
           --bs-btn-disabled-border-color: var(--fk-verde);
           --bs-btn-focus-shadow-rgb: 45, 198, 40;
       }

       .btn-warning {
           --bs-btn-color: #FFFFFF;
           --bs-btn-bg: var(--fk-cta);
           --bs-btn-border-color: var(--fk-cta);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-cta-oscuro);
           --bs-btn-hover-border-color: var(--fk-cta-oscuro);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-cta-oscuro);
           --bs-btn-active-border-color: var(--fk-cta-oscuro);
           --bs-btn-disabled-color: #FFFFFF;
           --bs-btn-disabled-bg: var(--fk-cta);
           --bs-btn-disabled-border-color: var(--fk-cta);
           --bs-btn-focus-shadow-rgb: 255, 112, 20;
       }

       .btn-secondary {
           --bs-btn-color: #FFFFFF;
           --bs-btn-bg: var(--fk-oscuro);
           --bs-btn-border-color: var(--fk-oscuro);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-negro);
           --bs-btn-hover-border-color: var(--fk-negro);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-negro);
           --bs-btn-active-border-color: var(--fk-negro);
           --bs-btn-disabled-bg: var(--fk-oscuro);
           --bs-btn-disabled-border-color: var(--fk-oscuro);
           --bs-btn-focus-shadow-rgb: 0, 35, 85;
       }

       .btn-outline-primary {
           --bs-btn-color: var(--fk-primario);
           --bs-btn-border-color: var(--fk-primario);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-primario);
           --bs-btn-hover-border-color: var(--fk-primario);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-primario);
           --bs-btn-active-border-color: var(--fk-primario);
           --bs-btn-disabled-color: var(--fk-primario);
           --bs-btn-disabled-border-color: var(--fk-primario);
           --bs-btn-focus-shadow-rgb: 0, 136, 255;
       }

       .btn-outline-success {
           --bs-btn-color: var(--fk-verde);
           --bs-btn-border-color: var(--fk-verde);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-verde);
           --bs-btn-hover-border-color: var(--fk-verde);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-verde);
           --bs-btn-active-border-color: var(--fk-verde);
           --bs-btn-disabled-color: var(--fk-verde);
           --bs-btn-disabled-border-color: var(--fk-verde);
           --bs-btn-focus-shadow-rgb: 45, 198, 40;
       }

       .btn-outline-warning {
           --bs-btn-color: var(--fk-cta);
           --bs-btn-border-color: var(--fk-cta);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-cta);
           --bs-btn-hover-border-color: var(--fk-cta);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-cta);
           --bs-btn-active-border-color: var(--fk-cta);
           --bs-btn-disabled-color: var(--fk-cta);
           --bs-btn-disabled-border-color: var(--fk-cta);
           --bs-btn-focus-shadow-rgb: 255, 112, 20;
       }

       .btn-outline-secondary {
           --bs-btn-color: var(--fk-oscuro);
           --bs-btn-border-color: var(--fk-oscuro);
           --bs-btn-hover-color: #FFFFFF;
           --bs-btn-hover-bg: var(--fk-oscuro);
           --bs-btn-hover-border-color: var(--fk-oscuro);
           --bs-btn-active-color: #FFFFFF;
           --bs-btn-active-bg: var(--fk-oscuro);
           --bs-btn-active-border-color: var(--fk-oscuro);
           --bs-btn-disabled-color: var(--fk-oscuro);
           --bs-btn-disabled-border-color: var(--fk-oscuro);
           --bs-btn-focus-shadow-rgb: 0, 35, 85;
       }
   </style>
   <style>
       /* Pequeño ajuste para que el body ocupe toda la altura y centrar contenido verticalmente */
       body {
           min-height: 100vh;
           background-color: var(--bs-body-bg);
           transition: background-color 0.3s ease, color 0.3s ease;
       }
      
       .card {
           transition: background-color 0.3s ease, border-color 0.3s ease;
       }
   </style>
</head>
<body>
   <div class="container py-5">
      
       <!-- Cabecera de la página -->
       <div class="d-flex justify-content-between align-items-center mb-4">
           <div>
               <h2 class="mb-1">Rendimiento de Ventas</h2>
               <p class="text-secondary mb-0">Demostración de Chart.js con variables de Bootstrap</p>
           </div>
          
           <!-- Botón para alternar tema claro/oscuro -->
           <button id="themeToggleBtn" class="btn btn-outline-secondary d-flex align-items-center gap-2 shadow-sm">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-stars-fill" viewBox="0 0 16 16">
                   <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
               </svg>
               Alternar Tema
           </button>
       </div>


       <!-- Tarjeta del Dashboard -->
       <div class="row">
           <div class="col-12 col-lg-10 mx-auto">
               <div class="card shadow-sm border-0 rounded-4">
                   <div class="card-header bg-transparent border-bottom py-3">
                       <h5 class="mb-0 text-body">Resumen Anual</h5>
                   </div>
                   <div class="card-body p-4">
                       <!-- El contenedor del canvas debe ser relativo para que Chart.js sea responsivo -->
                       <div class="position-relative w-100" style="height: 400px;">
                           <canvas id="miGrafica"></canvas>
                       </div>
                   </div>
                   <div class="card-footer bg-transparent border-top text-muted small py-3">
                       Los colores de esta gráfica se leen directamente de <code>:root</code> usando JavaScript, garantizando integración perfecta con temas.
                   </div>
               </div>
           </div>
       </div>
   </div>


   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script>
       // Referencias globales
       let miGrafica;
       const htmlElement = document.documentElement;
      
       // Función utilitaria para leer variables CSS globales del elemento html
       function getBSVar(varName) {
           return getComputedStyle(htmlElement).getPropertyValue(varName).trim();
       }


       // Configuración e inicialización de la gráfica
       function initChart() {
           const ctx = document.getElementById('miGrafica').getContext('2d');
          
           // Leemos las variables iniciales de Bootstrap
           const colorPrimario = getBSVar('--bs-primary');
           const colorInfo = getBSVar('--bs-info');
           const colorTexto = getBSVar('--bs-body-color');
           const colorBorde = getBSVar('--bs-border-color');
           const fuenteBS = getBSVar('--bs-font-sans-serif');


           miGrafica = new Chart(ctx, {
               type: 'bar',
               data: {
                   labels: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio'],
                   datasets: [
                       {
                           label: 'Ventas 2023',
                           data: [120, 190, 130, 150, 120, 180],
                           backgroundColor: colorPrimario, // Usamos variable de Bootstrap
                           borderRadius: 6, // Esquinas redondeadas estilo Bootstrap
                           borderSkipped: false
                       },
                       {
                           label: 'Ventas 2024',
                           data: [150, 210, 170, 190, 140, 220],
                           backgroundColor: colorInfo, // Usamos variable de Bootstrap
                           borderRadius: 6,
                           borderSkipped: false
                       }
                   ]
               },
               options: {
                   responsive: true,
                   maintainAspectRatio: false,
                   plugins: {
                       legend: {
                           labels: {
                               color: colorTexto, // Color de texto dinámico
                               font: {
                                   family: fuenteBS,
                                   size: 14
                               }
                           }
                       },
                       tooltip: {
                           bodyFont: { family: fuenteBS },
                           titleFont: { family: fuenteBS }
                       }
                   },
                   scales: {
                       x: {
                           ticks: {
                               color: colorTexto,
                               font: { family: fuenteBS }
                           },
                           grid: {
                               color: colorBorde, // Líneas divisorias con color de borde de BS
                               drawBorder: false
                           }
                       },
                       y: {
                           ticks: {
                               color: colorTexto,
                               font: { family: fuenteBS }
                           },
                           grid: {
                               color: colorBorde,
                               drawBorder: false
                           }
                       }
                   }
               }
           });
       }


       // Función para cambiar de tema y actualizar los colores de la gráfica en vivo
       function toggleTheme() {
           // Alternamos el atributo de Bootstrap
           const currentTheme = htmlElement.getAttribute('data-bs-theme');
           const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
           htmlElement.setAttribute('data-bs-theme', newTheme);
          
           // Actualizamos la apariencia del botón (opcional, para feedback visual)
           const btn = document.getElementById('themeToggleBtn');
           if(newTheme === 'dark') {
               btn.classList.replace('btn-outline-secondary', 'btn-outline-light');
           } else {
               btn.classList.replace('btn-outline-light', 'btn-outline-secondary');
           }


           // Damos un pequeño respiro (timeout) para que el navegador recalcule los estilos CSS
           // antes de que JavaScript intente leer las variables nuevamente.
           setTimeout(() => {
               // Leemos los nuevos colores basados en el nuevo tema activo
               const nuevoColorTexto = getBSVar('--bs-body-color');
               const nuevoColorBorde = getBSVar('--bs-border-color');
               const nuevoColorPrimario = getBSVar('--bs-primary');
               const nuevoColorInfo = getBSVar('--bs-info');


               // Actualizamos las propiedades dentro del objeto de Chart.js
               miGrafica.data.datasets[0].backgroundColor = nuevoColorPrimario;
               miGrafica.data.datasets[1].backgroundColor = nuevoColorInfo;
              
               miGrafica.options.plugins.legend.labels.color = nuevoColorTexto;
               miGrafica.options.scales.x.ticks.color = nuevoColorTexto;
               miGrafica.options.scales.y.ticks.color = nuevoColorTexto;
               miGrafica.options.scales.x.grid.color = nuevoColorBorde;
               miGrafica.options.scales.y.grid.color = nuevoColorBorde;


               // Redibujamos la gráfica con la nueva configuración
               miGrafica.update();
           }, 50);
       }


       // Event Listeners
       document.addEventListener('DOMContentLoaded', () => {
           initChart();
          
           document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
       });
   </script>
</body>
</html>
