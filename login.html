<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Fumitek V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="practica.html">Fumitek V2</a>
      </div>
    </nav>
  </header>

<main>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <div class="card shadow-sm mt-5 mb-5">
          <div class="card-body p-4">
            <h2 class="text-center mb-1">Iniciar sesión</h2>
            <p class="text-muted text-center mb-4">Ingresa tus datos para continuar.</p>

            <form action="practica.html" method="get">
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@correo.com" required>
              </div>

              <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
              </div>

              <!-- Captcha (visual) -->
              <div class="mb-3">
                <label for="captcha" class="form-label">Escribe el código de la imagen:</label>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <div class="flex-grow-1 bg-secondary-subtle border rounded text-center py-2 fs-4 fw-bold fst-italic user-select-none" style="letter-spacing: 6px;">
                    X7kP2
                  </div>
                  <button type="button" class="btn btn-outline-secondary" title="Cambiar código">↻</button>
                </div>
                <input type="text" class="form-control" id="captcha" name="captcha" placeholder="Código" required>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
                  <label class="form-check-label" for="recordar">Recordarme</label>
                </div>
                <a href="recuperar.html" class="small">¿Olvidaste tu contraseña?</a>
              </div>

              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <hr>

            <p class="text-center mb-0">
              ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
