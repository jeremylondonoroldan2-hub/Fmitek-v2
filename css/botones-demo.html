<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fumitek · Demo de botones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="botones.css">
    <style>
        .celda {
            min-height: 110px;
        }
    </style>
</head>

<body class="bg-light">
    <main class="container py-5">
        <h1 class="h3 mb-4">Botones Fumitek</h1>

        <div class="row text-center fw-bold mb-3">
            <div class="col-4">Azul</div>
            <div class="col-4">Verde</div>
            <div class="col-4">Naranja</div>
        </div>

        <!-- Tamaño 1 -->
        <p class="text-muted mb-2">Tamaño 1</p>
        <div class="row mb-4">
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-azul-1">Botón</button>
                <button class="btn fk-azul-1" disabled>Botón</button>
            </div>
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-verde-1">Botón</button>
                <button class="btn fk-verde-1" disabled>Botón</button>
            </div>
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-naranja-1">Botón</button>
                <button class="btn fk-naranja-1" disabled>Botón</button>
            </div>
        </div>

        <!-- Tamaño 2 -->
        <p class="text-muted mb-2">Tamaño 2</p>
        <div class="row mb-4">
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-azul-2">Botón</button>
                <button class="btn fk-azul-2" disabled>Botón</button>
            </div>
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-verde-2">Botón</button>
                <button class="btn fk-verde-2" disabled>Botón</button>
            </div>
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-naranja-2">Botón</button>
                <button class="btn fk-naranja-2" disabled>Botón</button>
            </div>
        </div>

        <!-- Tamaño 3 -->
        <p class="text-muted mb-2">Tamaño 3</p>
        <div class="row mb-4">
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-azul-3">Botón</button>
                <button class="btn fk-azul-3" disabled>Botón</button>
            </div>
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-verde-3">Botón</button>
                <button class="btn fk-verde-3" disabled>Botón</button>
            </div>
            <div class="col-4 celda d-flex align-items-center justify-content-center gap-3">
                <button class="btn fk-naranja-3">Botón</button>
                <button class="btn fk-naranja-3" disabled>Botón</button>
            </div>
        </div>
    </main>
</body>

</html>
