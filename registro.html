<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Fumitek V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/fumitek.css">
</head>
<body class="bg-light">

  <header>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Fumitek V2</a>
      </div>
    </nav>
  </header>

<main>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <div class="card shadow-sm mt-5 mb-5">
          <div class="card-body p-4">
            <h2 class="text-center mb-1">Crear cuenta</h2>
            <p class="text-muted text-center mb-4">Regístrate para solicitar servicios de fumigación.</p>

            <form>
              <h5 class="mt-2">Datos personales</h5>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="tipo" class="form-label">Tipo de cliente:</label>
                  <select class="form-select" id="tipo" name="tipo" required>
                    <option value="" selected disabled>Selecciona una opción</option>
                    <option value="persona">Persona</option>
                    <option value="empresa">Empresa</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="documento" class="form-label">Cédula / NIT:</label>
                  <input type="text" class="form-control" id="documento" name="documento" placeholder="1035945044" required>
                </div>
                <div class="col-12 mb-3">
                  <label for="nombre" class="form-label">Nombre completo o razón social:</label>
                  <input type="text" class="form-control" id="nombre" name="nombre" placeholder="nombre y apellido" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="telefono" class="form-label">Teléfono:</label>
                  <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="3001234567" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="ciudad" class="form-label">Ciudad:</label>
                  <input type="text" class="form-control" id="ciudad" name="ciudad" placeholder="Medellín" required>
                </div>
                <div class="col-12 mb-3">
                  <label for="direccion" class="form-label">Dirección:</label>
                  <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle 10 # 20-30, barrio" required>
                </div>
              </div>

              <h5 class="mt-3">Datos de acceso</h5>
              <div class="row">
                <div class="col-12 mb-3">
                  <label for="correo" class="form-label">Correo electrónico:</label>
                  <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@correo.com" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="contrasena" class="form-label">Contraseña:</label>
                  <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                  <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="confirmar" class="form-label">Confirmar contraseña:</label>
                  <input type="password" class="form-control" id="confirmar" name="confirmar" required>
                </div>
              </div>

              <!-- Captcha (visual) -->
              <div class="mb-3">
                <label for="captcha" class="form-label">Escribe el código de la imagen:</label>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <div class="flex-grow-1 bg-secondary-subtle border rounded text-center py-2 fs-4 fw-bold fst-italic user-select-none" style="letter-spacing: 6px;">
                    R8wN3
                  </div>
                  <button type="button" class="btn btn-outline-secondary" title="Cambiar código">↻</button>
                </div>
                <input type="text" class="form-control" id="captcha" name="captcha" placeholder="Código" required>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terminos" name="terminos" required>
                <label class="form-check-label" for="terminos">
                  Acepto los términos y condiciones y el tratamiento de mis datos personales.
                </label>
              </div>

              <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#exitoRegistro">
                Crear cuenta
              </button>
            </form>

            <hr>

            <p class="text-center mb-0">
              ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<!-- ========== MENSAJES DE CONFIRMACIÓN ========== -->

<!-- Mensaje: cuenta creada -->
<div class="modal fade" id="exitoRegistro" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Cuenta creada</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Tu cuenta se creó correctamente. Ya puedes iniciar sesión.
      </div>
      <div class="modal-footer">
        <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
