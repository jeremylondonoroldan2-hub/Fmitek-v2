<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar cliente | Fumitek V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="practica.html">Fumitek V2</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#collapsibleNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="practica.html">inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="informacionPersonal.html">información personal</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    </header>

<div class="container mt-4 mb-5">
  <h2>Editar información</h2>
  <p class="text-muted">Actualiza los datos del cliente y guarda los cambios.</p>

  <form>
    <h5 class="mt-4">Datos del cliente</h5>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="cedula" class="form-label">Cédula:</label>
        <input type="text" class="form-control" id="cedula" name="cedula" value="10348430943" readonly>
      </div>
      <div class="col-md-6 mb-3">
        <label for="nombre" class="form-label">Nombre completo:</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="John" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="correo" class="form-label">Correo electrónico:</label>
        <input type="email" class="form-control" id="correo" name="correo" value="johan@gmail.com" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="telefono" class="form-label">Número de teléfono:</label>
        <input type="tel" class="form-control" id="telefono" name="telefono" value="3022678958" required>
      </div>
      <div class="col-12 mb-3">
        <label for="direccion" class="form-label">Dirección:</label>
        <input type="text" class="form-control" id="direccion" name="direccion" value="Cl 27" required>
      </div>
    </div>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalConfirmacion">
      Guardar cambios
    </button>
    <a href="informacionPersonal.html" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>

<div class="modal fade" id="modalConfirmacion" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Cambios guardados</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        La información del cliente se actualizó correctamente.
      </div>
      <div class="modal-footer">
        <a href="informacionPersonal.html" class="btn btn-primary">Volver a la lista</a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
